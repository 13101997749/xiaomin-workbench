<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晓敏的工作台 · 教师暑期成长</title>
<style>
/* ========== 全局变量（温柔粉色治愈风） ========== */
:root{
  --bg-pink:#ffe9f2;
  --bg-pink-soft:#fff3f8;
  --card-bg:#ffffff;
  --title-pink:#e85a8a;
  --title-deep:#d64a7c;
  --accent:#f4a7c3;
  --accent-deep:#ec7ba5;
  --lavender:#c5b3e6;
  --peach:#ffc9a8;
  --text-main:#5a4a56;
  --text-soft:#b09aaa;
  --shadow:0 6px 18px rgba(232,90,138,0.15);
  --shadow-soft:0 3px 10px rgba(232,90,138,0.10);
  --radius:16px;
  --radius-sm:10px;
  --sidebar-w:210px;
  --sidebar-w-collapsed:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--text-main);
  background-color:var(--bg-pink);
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.95) 1.5px, transparent 1.6px),
    radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1.2px);
  background-size:24px 24px, 16px 16px;
  background-position:0 0, 12px 12px;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,textarea,select{font-family:inherit;outline:none;}
ul{list-style:none;}

/* ========== 应用容器 ========== */
.app{display:flex;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(232,90,138,0.2);}

/* ========== 侧边导航栏 ========== */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,#ffd6e6 0%,#ffe9f2 100%);
  border-right:2px solid rgba(255,255,255,0.6);
  display:flex;flex-direction:column;
  transition:width .32s cubic-bezier(.4,0,.2,1);
  overflow:hidden;z-index:30;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-header{padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;border-bottom:1px dashed rgba(232,90,138,0.3);}
.avatar{
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#ffc2d9,#f4a7c3);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  border:3px solid #fff;box-shadow:0 4px 12px rgba(232,90,138,0.35);flex-shrink:0;
}
.nickname{margin-top:8px;font-size:13px;color:var(--title-pink);font-weight:600;white-space:nowrap;text-align:center;}
.sidebar.collapsed .nickname{display:none;}
.collapse-btn{
  position:absolute;top:14px;right:-14px;width:28px;height:28px;border-radius:50%;
  background:#fff;color:var(--title-deep);display:flex;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 2px 8px rgba(232,90,138,0.35);z-index:31;transition:transform .32s;
}
.sidebar.collapsed .collapse-btn{transform:rotate(180deg);}
.nav-list{flex:1;overflow-y:auto;padding:10px 0;}
.nav-list::-webkit-scrollbar{width:0;}
.nav-item{
  display:flex;align-items:center;padding:11px 14px;margin:2px 8px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--text-main);font-size:14px;transition:all .2s;white-space:nowrap;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.55);}
.nav-item.active{background:#fff;color:var(--title-pink);font-weight:600;box-shadow:var(--shadow-soft);}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:60%;background:var(--title-pink);border-radius:0 4px 4px 0;
}
.nav-icon{font-size:18px;margin-right:10px;flex-shrink:0;}
.sidebar.collapsed .nav-icon{margin-right:0;}
.nav-text{transition:opacity .2s;}
.sidebar.collapsed .nav-text{display:none;}
.sidebar-footer{padding:10px;text-align:center;font-size:11px;color:var(--text-soft);border-top:1px dashed rgba(232,90,138,0.3);}
.sidebar.collapsed .sidebar-footer{display:none;}

/* ========== 主面板 ========== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.main-header{padding:14px 16px 6px;flex-shrink:0;}
.page-title{font-size:20px;color:var(--title-pink);font-weight:700;display:flex;align-items:center;gap:8px;}
.page-subtitle{font-size:12px;color:var(--text-soft);margin-top:2px;}

/* ===== 桌面核心组件条 ===== */
.home-strip{padding:4px 14px 8px;flex-shrink:0;}
.hs-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hs-clock{
  background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--title-pink);
  box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:6px;
}
.hs-date{font-size:11px;color:var(--text-soft);font-weight:400;}
.hs-checkin{
  border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#f4a7c3,#ec7ba5);box-shadow:var(--shadow-soft);transition:transform .15s;
}
.hs-checkin:active{transform:scale(.95);}
.hs-checkin.done{background:linear-gradient(135deg,#9adcc3,#5cbfa0);}
.hs-mode{display:flex;background:#fff;border-radius:20px;padding:3px;box-shadow:var(--shadow-soft);margin-left:auto;}
.hs-mode button{border-radius:16px;padding:5px 10px;font-size:11px;color:var(--text-soft);background:transparent;font-weight:600;}
.hs-mode button.active{background:var(--title-pink);color:#fff;}
.hs-quote{
  margin-top:8px;background:linear-gradient(135deg,#fff 0%,#fff3f8 100%);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;line-height:1.6;color:var(--text-main);
  box-shadow:var(--shadow-soft);border-left:3px solid var(--accent);
}
.hs-quote .en{display:block;font-size:11px;color:var(--text-soft);font-style:italic;margin-top:2px;}

/* 标签栏 */
.tabs-wrap{padding:0 12px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;gap:8px;}
.tab{
  flex-shrink:0;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,0.7);
  font-size:13px;color:var(--text-main);white-space:nowrap;transition:all .2s;border:1.5px solid transparent;
}
.tab:hover{background:#fff;}
.tab.active{background:#fff;color:var(--title-pink);border-color:var(--accent);font-weight:600;box-shadow:var(--shadow-soft);}

/* 内容区 */
.content{flex:1;overflow-y:auto;padding:4px 14px 40px;scrollbar-width:thin;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;}

/* 卡片 */
.card{background:var(--card-bg);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-soft);}
.card-title{font-size:15px;font-weight:700;color:var(--title-pink);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.card-title .right{margin-left:auto;font-size:11px;color:var(--text-soft);font-weight:400;}

/* 输入与按钮 */
.input,.textarea,select.input{
  width:100%;padding:9px 12px;border:1.5px solid #f6d5e2;border-radius:var(--radius-sm);
  font-size:13px;color:var(--text-main);background:#fffdfa;margin-bottom:8px;
}
.textarea{min-height:70px;resize:vertical;}
.input:focus,.textarea:focus{border-color:var(--accent);}
.btn{border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;transition:transform .15s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,#f4a7c3,#ec7ba5);color:#fff;box-shadow:var(--shadow-soft);}
.btn-add{background:linear-gradient(135deg,#f4a7c3,#ec7ba5);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:var(--shadow-soft);}
.btn-mini{padding:4px 10px;border-radius:12px;font-size:12px;background:#ffeef5;color:var(--title-pink);border:1px solid #f6d5e2;}
.btn-del{padding:4px 10px;border-radius:12px;font-size:12px;background:#fff0f0;color:#e06b6b;border:1px solid #f6d5d5;}

/* 勾选清单 */
.chk-wrap{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);margin-bottom:6px;background:#fffdfa;border:1px solid #fdeef4;}
.chk-wrap.done{background:#fdf2f7;}
.chk{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0;margin-top:1px;
  cursor:pointer;transition:all .2s;position:relative;
}
.chk.checked{background:var(--title-pink);border-color:var(--title-pink);}
.chk.checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.chk-wrap.done .chk-text{text-decoration:line-through;color:var(--text-soft);}
.chk-text{flex:1;font-size:13px;word-break:break-all;line-height:1.5;}
.chk-mins{font-size:11px;color:var(--accent-deep);flex-shrink:0;background:#ffeef5;padding:2px 8px;border-radius:10px;}

/* 日记/记录条目 */
.entry{background:#fffdfa;border:1px solid #fdeef4;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.entry-date{font-size:11px;color:var(--text-soft);background:#ffeef5;padding:2px 8px;border-radius:10px;}
.entry-title{font-size:13px;font-weight:600;color:var(--title-deep);flex:1;word-break:break-all;}
.entry-body{font-size:12px;line-height:1.7;color:var(--text-main);word-break:break-all;white-space:pre-wrap;}
.entry-del{margin-left:auto;}
.field-label{font-size:11px;color:var(--accent-deep);font-weight:600;margin-right:4px;}

/* 干货卡片 */
.tip-card{
  background:linear-gradient(135deg,#fff 0%,#fff5fa 100%);
  border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border-left:3px solid var(--accent);
}
.tip-card h4{font-size:13px;color:var(--title-deep);margin-bottom:5px;}
.tip-card p{font-size:12px;line-height:1.7;color:var(--text-main);}
.tip-tag{display:inline-block;font-size:10px;background:#ffeef5;color:var(--accent-deep);padding:2px 8px;border-radius:10px;margin-right:4px;margin-bottom:4px;}

/* 心情选择 */
.mood-row{display:flex;gap:8px;justify-content:space-around;margin:8px 0 12px;}
.mood-btn{
  width:48px;height:48px;border-radius:50%;background:#fffdfa;border:2px solid #f6d5e2;
  font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer;
}
.mood-btn.selected{border-color:var(--title-pink);background:#ffeef5;transform:scale(1.12);box-shadow:var(--shadow-soft);}

/* 状态行 */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed #fdeef4;font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text-soft);}
.stat-val{font-weight:600;color:var(--title-deep);text-align:right;}
.progress-track{background:#fdeef4;border-radius:8px;height:10px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#f4a7c3,#c5b3e6);border-radius:8px;transition:width .5s;}

.date-display{font-size:12px;color:var(--text-soft);text-align:center;margin-bottom:8px;}
.date-display span{color:var(--title-pink);font-weight:600;}
.empty-state{text-align:center;padding:36px 20px;color:var(--text-soft);font-size:13px;}
.empty-state .emoji{font-size:36px;display:block;margin-bottom:8px;}
.mode-hint{font-size:11px;color:var(--text-soft);text-align:center;margin-bottom:8px;}

/* toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);
  background:rgba(90,74,86,0.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  z-index:100;opacity:0;pointer-events:none;transition:all .25s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ========== 平板适配（竖屏） ========== */
@media (min-width:768px) and (max-width:899px){
  .app{max-width:680px;}
  .page-title{font-size:23px;}
  .tab{font-size:14px;padding:8px 18px;}
  .card-title{font-size:16px;}
  .chk-text,.entry-body{font-size:14px;}
}

/* ========== 平板适配（横屏） ========== */
@media (min-width:900px){
  .app{max-width:1100px;}
  .sidebar{width:230px;}
  .avatar{width:66px;height:66px;font-size:32px;}
  .nickname{font-size:14px;}
  .nav-item{font-size:15px;padding:13px 18px;}
  .nav-icon{font-size:20px;}
  .main-header{padding:20px 24px 8px;}
  .page-title{font-size:26px;}
  .page-subtitle{font-size:13px;}
  .home-strip{padding:6px 22px 10px;}
  .hs-clock{font-size:15px;padding:8px 16px;}
  .hs-checkin{font-size:13px;padding:9px 18px;}
  .hs-mode button{font-size:12px;padding:6px 14px;}
  .hs-quote{font-size:13px;padding:12px 16px;}
  .hs-quote .en{font-size:12px;}
  .tabs-wrap{padding:0 20px 10px;}
  .tab{font-size:14px;padding:9px 20px;}
  .content{padding:8px 20px 40px;columns:2;column-gap:14px;}
  .date-display,.empty-state,.mode-hint{column-span:all;font-size:13px;}
  .card{break-inside:avoid;padding:18px;}
  .card-title{font-size:16px;}
  .chk-text,.entry-body{font-size:14px;}
  .stat-row{font-size:14px;}
  .input,.textarea,select.input{font-size:14px;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 侧边导航栏 -->
  <aside class="sidebar" id="sidebar">
    <button class="collapse-btn" id="collapseBtn">‹</button>
    <div class="sidebar-header">
      <div class="avatar">🌸</div>
      <div class="nickname">晓敏的工作台</div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">💗 暑期成长 · 治愈同行</div>
  </aside>

  <!-- 主面板 -->
  <main class="main">
    <div class="main-header">
      <div class="page-title" id="pageTitle">🌸 教师暑期成长</div>
      <div class="page-subtitle" id="pageSubtitle">身心疗愈 · 体能提升 · 教学赋能 · 教研精进 · 自我沉淀</div>
    </div>

    <!-- 桌面核心组件条 -->
    <div class="home-strip">
      <div class="hs-row">
        <div class="hs-clock">🕐<span id="clockTime">--:--:--</span><span class="hs-date" id="clockDate"></span></div>
        <button class="hs-checkin" id="checkinBtn">☀️ 今日打卡</button>
        <div class="hs-mode">
          <button id="modeTodayBtn" class="active">☀️ 今日</button>
          <button id="modeAllBtn">📚 累计</button>
        </div>
      </div>
      <div class="hs-quote" id="dailyQuote"></div>
    </div>

    <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
    <div class="content" id="content"></div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据层：localStorage 持久化
============================================================ */
const STORE_KEY = 'xiaomin_teacher_v1';
let DB = {};
function loadDB(){ try{ DB = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ DB = {}; } }
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function getDB(key, def){ if(!(key in DB)){ DB[key] = def; } return DB[key]; }
function setDB(key, val){ DB[key] = val; saveDB(); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const pad2 = n => String(n).padStart(2,'0');
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayCN(){ const d=new Date(); return `${d.getMonth()+1}月${d.getDate()}日`; }
function addDays(ds,n){ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];

/* ============================================================
   菜单配置（11个专属功能菜单）
============================================================ */
const MENUS = [
  { id:'heal', icon:'💖', name:'心理疗愈', sub:'情绪打卡 · 心灵随笔 · 冥想 · 心理干货',
    tabs:[
      {id:'mood', name:'情绪打卡'},
      {id:'essay', name:'心灵随笔'},
      {id:'meditation', name:'解压冥想'},
      {id:'psy', name:'心理干货'},
    ]
  },
  { id:'sport', icon:'🏃', name:'体能锻炼', sub:'拉伸 · 肩颈 · 有氧 · 体态',
    tabs:[
      {id:'sport_check', name:'今日打卡'},
      {id:'sport_lib', name:'运动清单'},
      {id:'body_rec', name:'身体记录'},
    ]
  },
  { id:'ai', icon:'🤖', name:'AI教学赋能', sub:'工具库 · 实操案例 · 收藏',
    tabs:[
      {id:'ai_tools', name:'AI工具库'},
      {id:'ai_case', name:'实操案例'},
      {id:'ai_fav', name:'我的收藏'},
    ]
  },
  { id:'lesson', icon:'📚', name:'新学期备课', sub:'备课记录 · 素材库 · 听课反思',
    tabs:[
      {id:'lesson_rec', name:'备课记录'},
      {id:'lesson_mat', name:'素材库'},
      {id:'lesson_ref', name:'听课反思'},
    ]
  },
  { id:'listen', icon:'🎧', name:'听课学习', sub:'观摩记录 · 好课清单',
    tabs:[
      {id:'listen_rec', name:'观摩记录'},
      {id:'listen_list', name:'好课清单'},
    ]
  },
  { id:'read', icon:'📖', name:'暑期阅读', sub:'书单 · 阅读打卡 · 读书笔记',
    tabs:[
      {id:'read_list', name:'我的书单'},
      {id:'read_check', name:'阅读打卡'},
      {id:'read_note', name:'读书笔记'},
    ]
  },
  { id:'write', icon:'✍️', name:'教育写作', sub:'教育随笔 · 选题清单 · 写作打卡',
    tabs:[
      {id:'write_essay', name:'教育随笔'},
      {id:'write_topic', name:'选题清单'},
      {id:'write_check', name:'写作打卡'},
    ]
  },
  { id:'skill', icon:'🖊️', name:'教学基本功', sub:'粉笔字 · 普通话 · 简笔画',
    tabs:[
      {id:'skill_check', name:'每日练习'},
      {id:'skill_rec', name:'练习记录'},
    ]
  },
  { id:'clazz', icon:'🌟', name:'班级管理', sub:'班主任锦囊 · 家校沟通 · 开学第一课',
    tabs:[
      {id:'class_tip', name:'班主任锦囊'},
      {id:'class_home', name:'家校沟通'},
      {id:'class_first', name:'开学第一课'},
    ]
  },
  { id:'life', icon:'🌸', name:'生活美学', sub:'小确幸 · 心愿清单',
    tabs:[
      {id:'life_joy', name:'小确幸'},
      {id:'life_wish', name:'心愿清单'},
    ]
  },
  { id:'plan', icon:'📋', name:'计划复盘', sub:'今日计划 · 晚间复盘 · 周总结',
    tabs:[
      {id:'plan_todo', name:'今日计划'},
      {id:'plan_rev', name:'晚间复盘'},
      {id:'plan_week', name:'每周总结'},
    ]
  },
];

let currentMenu = 'heal';
let currentTab = 'mood';
let VIEW_MODE = 'today'; // today=每日重置 | all=累积记录

/* ============================================================
   每日一句（中文 + 英文翻译，每日自动更新）
============================================================ */
const QUOTES = [
  {cn:'教育是一棵树摇动另一棵树，一朵云推动另一朵云。', en:'Education is one tree shaking another, one cloud pushing another.'},
  {cn:'学高为师，身正为范。', en:'Deep learning makes a teacher; integrity sets the example.'},
  {cn:'每一次耐心的讲解，都在点亮一颗心。', en:'Every patient explanation lights up a heart.'},

   渲染：侧边栏 / 标签栏 / 内容区
============================================================ */
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = MENUS.map(m=>`
    <li class="nav-item ${m.id===currentMenu?'active':''}" data-menu="${m.id}">
      <span class="nav-icon">${m.icon}</span>
      <span class="nav-text">${m.name}</span>
    </li>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{
      currentMenu = el.dataset.menu;
      currentTab = MENUS.find(m=>m.id===currentMenu).tabs[0].id;
      renderAll();
    };
  });
}

function renderTabs(){
  const menu = MENUS.find(m=>m.id===currentMenu);
  document.getElementById('pageTitle').innerHTML = `${menu.icon} ${menu.name}`;
  document.getElementById('pageSubtitle').textContent = menu.sub;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = menu.tabs.map(t=>`
    <div class="tab ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.name}</div>
  `).join('');
  tabs.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ currentTab = el.dataset.tab; renderTabs(); renderContent(); };
  });
}

function renderContent(){
  const c = document.getElementById('content');
  c.scrollTop = 0;
  const fn = RENDERS[currentTab];
  c.innerHTML = fn ? fn() : '<div class="empty-state"><span class="emoji">🚧</span>建设中...</div>';
}

function renderAll(){ renderNav(); renderTabs(); renderContent(); renderTopbar(); }

/* ============================================================
   桌面核心组件：实时时钟 / 每日打卡 / 每日一句 / 模式切换
============================================================ */
function renderTopbar(){
  // 每日一句
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const dayOfYear = Math.floor((now-start)/86400000);
  const q = QUOTES[dayOfYear % QUOTES.length];
  document.getElementById('dailyQuote').innerHTML =
    `💬 每日一句：${escapeHtml(q.cn)}<span class="en">${escapeHtml(q.en)}</span>`;
  // 打卡按钮
  const days = getDB('checkin_dates', []);
  const btn = document.getElementById('checkinBtn');
  const has = days.includes(today());
  const streak = getStreak();
  btn.className = 'hs-checkin' + (has ? ' done' : '');
  btn.textContent = has ? `✅ 已打卡 · 连续${streak}天` : (streak>0 ? `☀️ 今日打卡 · 已连${streak}天` : '☀️ 今日打卡');
  // 模式按钮
  document.getElementById('modeTodayBtn').className = VIEW_MODE==='today' ? 'active' : '';
  document.getElementById('modeAllBtn').className = VIEW_MODE==='all' ? 'active' : '';
}

function getStreak(){
  const set = new Set(getDB('checkin_dates', []));
  let streak = 0, cursor = today();
  if(!set.has(cursor)) cursor = addDays(cursor,-1);
  while(set.has(cursor)){ streak++; cursor = addDays(cursor,-1); }
  return streak;
}

document.getElementById('checkinBtn').onclick = ()=>{
  const days = getDB('checkin_dates', []);
  const t = today();
  const i = days.indexOf(t);
  if(i>=0){ days.splice(i,1); toast('已取消今日打卡'); }
  else { days.push(t); toast('打卡成功 🎉'); }
  setDB('checkin_dates', days);
  renderTopbar();
};

document.getElementById('modeTodayBtn').onclick = ()=>{ VIEW_MODE='today'; setDB('view_mode','today'); renderTopbar(); renderContent(); };
document.getElementById('modeAllBtn').onclick = ()=>{ VIEW_MODE='all'; setDB('view_mode','all'); renderTopbar(); renderContent(); };

function tickClock(){
  const d = new Date();
  document.getElementById('clockTime').textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  document.getElementById('clockDate').textContent = ` ${d.getMonth()+1}月${d.getDate()}日 ${WEEK_CN[d.getDay()]}`;
}
setInterval(tickClock, 1000);

const RENDERS = {};

/* ---------- 工厂1：清单打卡（persist=true 累积清单 / false 每日重置） ---------- */
function checklistRenderer(key, cfg){
  return function(){
    const d = today();
    const customKey = `cl_${key}_items`;
    const doneKey = cfg.persist ? `cl_${key}_done` : `cl_${key}_done_${d}`;
    const customs = getDB(customKey, []);
    const done = getDB(doneKey, {});
    const items = [
      ...cfg.presets.map((p,i)=>({id:'p'+i, text:p.text, mins:p.mins||0, preset:true})),
      ...customs.map(c=>({id:'c'+c.id, text:c.text, mins:c.mins||0, preset:false})),
    ];
    const doneCount = items.filter(it=>done[it.id]).length;
    const totalMins = items.filter(it=>done[it.id]).reduce((s,it)=>s+(it.mins||0),0);
    const rate = items.length ? Math.round(doneCount/items.length*100) : 0;

    let html = `<div class="date-display">📅 <span>${todayCN()}</span> · ${cfg.icon} ${cfg.title}</div>`;

    if(cfg.persist){
      html += `
        <div class="card">
          <div class="card-title">${cfg.icon} ${cfg.title}<span class="right">累积完成 ${doneCount}/${items.length}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${rate}%;"></div></div>
        </div>`;
    } else if(VIEW_MODE==='all'){
      const stats = checklistStats(key);
      html += `
        <div class="card">
          <div class="card-title">📚 累计记录<span class="right">切换到「今日」可打卡</span></div>
          <div class="stat-row"><span class="stat-label">累计打卡天数</span><span class="stat-val">${stats.days} 天</span></div>
          <div class="stat-row"><span class="stat-label">累计完成项目</span><span class="stat-val">${stats.total} 项</span></div>
          ${stats.totalMins ? `<div class="stat-row"><span class="stat-label">累计时长</span><span class="stat-val">${stats.totalMins} 分钟</span></div>` : ''}
        </div>
        <div class="card">
          <div class="card-title">🗓️ 最近7天</div>
          ${stats.recent}
        </div>`;
      return html;
    } else {
      html += `
        <div class="card">
          <div class="card-title">${cfg.icon} ${cfg.title}<span class="right">${doneCount}/${items.length} 完成</span></div>
          ${cfg.desc ? `<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">${cfg.desc}</div>` : ''}
          <div class="progress-track"><div class="progress-fill" style="width:${rate}%;"></div></div>
          ${cfg.hasMins ? `<div class="stat-row" style="margin-top:6px;"><span class="stat-label">今日累计时长</span><span class="stat-val">⏱️ ${totalMins} 分钟</span></div>` : ''}
        </div>`;
    }

    html += `<div class="card"><div class="card-title">📋 ${cfg.persist?'清单':'今日清单'}<span class="right">点击圆圈打卡</span></div>`;
    if(!items.length) html += `<div class="empty-state"><span class="emoji">🌱</span>还没有内容，在下方添加一条吧</div>`;
    items.forEach(it=>{
      const isDone = done[it.id];
      html += `
        <div class="chk-wrap ${isDone?'done':''}">
          <div class="chk ${isDone?'checked':''}" onclick="clToggle('${key}','${it.id}',${cfg.persist?1:0})"></div>
          <div class="chk-text">${escapeHtml(it.text)}</div>
          ${it.mins ? `<span class="chk-mins">${it.mins}分钟</span>` : ''}
          ${!it.preset ? `<button class="btn-del" onclick="clDelCustom('${key}','${it.id}')">删</button>` : ''}
        </div>`;
    });
    html += `
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input class="input" id="cl_add_${key}" placeholder="${cfg.addPh||'添加一项…'}" style="margin-bottom:0;flex:1;">
        ${cfg.hasMins ? `<input class="input" id="cl_min_${key}" type="number" placeholder="分钟" style="margin-bottom:0;width:70px;">` : ''}
        <button class="btn-add" onclick="clAdd('${key}',${cfg.hasMins?1:0})">＋</button>
      </div>
    </div>`;
    return html;
  };
}

function checklistStats(key){
  const prefix = `cl_${key}_done_`;
  const dayKeys = Object.keys(DB).filter(k=>k.startsWith(prefix));
  let total = 0, totalMins = 0;
  const cfg = CHECK_CFGS[key];
  const allPresetMins = {};
  if(cfg){ cfg.presets.forEach((p,i)=>{ allPresetMins['p'+i] = p.mins||0; }); }
  const customs = getDB(`cl_${key}_items`, []);
  customs.forEach(c=>{ allPresetMins['c'+c.id] = c.mins||0; });
  dayKeys.forEach(k=>{
    const done = DB[k]||{};
    Object.keys(done).forEach(id=>{
      if(done[id]){ total++; totalMins += allPresetMins[id]||0; }
    });
  });
  const recent = dayKeys.sort().slice(-7).reverse().map(k=>{
    const cnt = Object.values(DB[k]||{}).filter(Boolean).length;
    const ds = k.replace(prefix,'');
    return `<div class="stat-row"><span class="stat-label">${ds.slice(5).replace('-','月')}日</span><span class="stat-val">完成 ${cnt} 项</span></div>`;
  }).join('') || '<div class="empty-state"><span class="emoji">🌱</span>暂无记录</div>';
  return {days:dayKeys.length, total, totalMins, recent};
}

const CHECK_CFGS = {};
function clToggle(key, id, persist){
  const doneKey = persist ? `cl_${key}_done` : `cl_${key}_done_${today()}`;
  const done = getDB(doneKey, {});
  done[id] = !done[id];
  setDB(doneKey, done);
  renderContent();
  if(done[id]) toast('打卡 ✓');
}
function clAdd(key, hasMins){
  const inp = document.getElementById('cl_add_'+key);
  const text = inp.value.trim();
  if(!text){ toast('先写点内容哦'); return; }
  const mins = hasMins ? (parseInt(document.getElementById('cl_min_'+key).value)||0) : 0;
  const customs = getDB(`cl_${key}_items`, []);
  customs.push({id:Date.now(), text, mins});
  setDB(`cl_${key}_items`, customs);
  toast('已添加 🌸');
  renderContent();
}
function clDelCustom(key, cid){
  let customs = getDB(`cl_${key}_items`, []);
  customs = customs.filter(c=> 'c'+c.id !== cid);
  setDB(`cl_${key}_items`, customs);
  toast('已删除 🗑');
  renderContent();
}

/* ---------- 工厂2：日记/记录列表（今日模式只看今天，累计模式看全部） ---------- */
function journalRenderer(key, cfg){
  return function(){
    const listKey = `j_${key}`;
    const list = getDB(listKey, []);
    const t = today();
    const shown = VIEW_MODE==='today' ? list.filter(e=>e.d===t) : [...list].reverse();
    let html = `<div class="date-display">📅 <span>${todayCN()}</span> · ${cfg.icon} ${cfg.title}</div>`;
    html += `
      <div class="card">
        <div class="card-title">${cfg.icon} ${cfg.title}<span class="right">${VIEW_MODE==='today'?'今日 '+shown.length+' 条':'累计 '+list.length+' 条'}</span></div>
        ${cfg.desc ? `<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">${cfg.desc}</div>` : ''}
        ${cfg.fields.map(f=> f.multi
          ? `<textarea class="textarea" id="jf_${key}_${f.name}" placeholder="${f.label}…"></textarea>`
          : `<input class="input" id="jf_${key}_${f.name}" placeholder="${f.label}…">`).join('')}
        <button class="btn-add" style="width:100%;" onclick="jAdd('${key}')">＋ 保存记录</button>
      </div>
      <div class="card">
        <div class="card-title">🗂️ ${VIEW_MODE==='today'?'今日记录':'全部记录'}<span class="right">${shown.length} 条</span></div>`;
    if(!shown.length) html += `<div class="empty-state"><span class="emoji">${cfg.emptyEmoji||'🌱'}</span>${VIEW_MODE==='today'?'今天还没有记录，写一条吧':'暂无记录'}</div>`;
    shown.forEach(e=>{
      html += `
        <div class="entry">
          <div class="entry-head">
            <span class="entry-date">${e.d.slice(5).replace('-','月')}日</span>
            ${e.title ? `<span class="entry-title">${escapeHtml(e.title)}</span>` : ''}
            <button class="btn-del entry-del" onclick="jDel('${key}',${e.id})">删</button>
          </div>
          <div class="entry-body">${cfg.render(e)}</div>
        </div>`;
    });
    html += `</div>`;
    return html;
  };
}
const JOURNAL_CFGS = {};
function jAdd(key){
  const cfg = JOURNAL_CFGS[key];
  const e = {id:Date.now(), d:today(), v:{}};
  let empty = true;
  cfg.fields.forEach(f=>{
    const el = document.getElementById(`jf_${key}_${f.name}`);
    e.v[f.name] = el.value.trim();
    if(e.v[f.name]) empty = false;
  });
  if(empty){ toast('先写点内容哦'); return; }
  const titleField = cfg.fields[0];
  e.title = titleField.multi ? '' : (e.v[titleField.name]||'').slice(0,30);
  const list = getDB(`j_${key}`, []);
  list.push(e);
  setDB(`j_${key}`, list);
  toast('已保存 💗');
  renderContent();
}
function jDel(key, id){
  let list = getDB(`j_${key}`, []);
  list = list.filter(e=>e.id!==id);
  setDB(`j_${key}`, list);
  toast('已删除 🗑');
  renderContent();
}

/* ---------- 工厂3：干货卡片（预设 + 可添加自己的） ---------- */
function cardsRenderer(key, cfg){
  return function(){
    const customs = getDB(`cards_${key}`, []);
    let html = `<div class="date-display">📅 <span>${todayCN()}</span> · ${cfg.icon} ${cfg.title}</div>`;
    html += `<div class="card"><div class="card-title">${cfg.icon} ${cfg.title}</div>${cfg.desc?`<div style="font-size:12px;color:var(--text-soft);">${cfg.desc}</div>`:''}</div>`;
    cfg.cards.forEach(c=>{
      html += `
        <div class="tip-card">
          <h4>${c.tag ? `<span class="tip-tag">${c.tag}</span>` : ''}${escapeHtml(c.title)}</h4>
          <p>${escapeHtml(c.body)}</p>
        </div>`;
    });
    customs.forEach(c=>{
      html += `
        <div class="tip-card" style="border-left-color:var(--lavender);">
          <h4>${escapeHtml(c.title)}<button class="btn-del" style="float:right;" onclick="cardDel('${key}',${c.id})">删</button></h4>
          <p>${escapeHtml(c.body)}</p>
        </div>`;
    });
    html += `
      <div class="card">
        <div class="card-title">✏️ 添加我自己的</div>
        <input class="input" id="card_t_${key}" placeholder="标题…">
        <textarea class="textarea" id="card_b_${key}" placeholder="内容…"></textarea>
        <button class="btn-add" style="width:100%;" onclick="cardAdd('${key}')">＋ 添加</button>
      </div>`;
    return html;
  };
}
function cardAdd(key){
  const t = document.getElementById('card_t_'+key).value.trim();
  const b = document.getElementById('card_b_'+key).value.trim();
  if(!t && !b){ toast('先写点内容哦'); return; }
  const customs = getDB(`cards_${key}`, []);
  customs.push({id:Date.now(), title:t||'未命名', body:b});
  setDB(`cards_${key}`, customs);
  toast('已添加 🌸');
  renderContent();
}
function cardDel(key, id){
  let customs = getDB(`cards_${key}`, []);
  customs = customs.filter(c=>c.id!==id);
  setDB(`cards_${key}`, customs);
  toast('已删除 🗑');
  renderContent();
}

    <div class="date-display">📅 <span>${todayCN()}</span> · 💖 情绪打卡</div>

// 书单（想读/在读/读完 状态流转）
RENDERS.read_list = function(){
  const books = getDB('read_books', []);
  const STATUS = ['📖 想读','⏳ 在读','✅ 读完'];
  let html = `
    <div class="date-display">📅 <span>${todayCN()}</span> · 📖 我的书单</div>
    <div class="card">
      <div class="card-title">📚 添加新书</div>
      <input class="input" id="book_name" placeholder="书名…">
      <input class="input" id="book_author" placeholder="作者（可选）…">
      <button class="btn-add" style="width:100%;" onclick="bookAdd()">＋ 加入书单</button>
    </div>
    <div class="card">
      <div class="card-title">📖 我的书单<span class="right">共 ${books.length} 本 · 读完 ${books.filter(b=>b.s===2).length} 本</span></div>`;
  if(!books.length) html += `<div class="empty-state"><span class="emoji">🌱</span>书单还是空的，添加第一本吧</div>`;
  books.forEach((b,i)=>{
    html += `
      <div class="entry">
        <div class="entry-head">
          <span class="entry-title">《${escapeHtml(b.name)}》${b.author?' · '+escapeHtml(b.author):''}</span>
          <button class="btn-mini" onclick="bookNext(${i})">${STATUS[b.s]}</button>
          <button class="btn-del entry-del" onclick="bookDel(${i})">删</button>
        </div>
      </div>`;
  });
  html += `</div>
    <div class="tip-card"><h4>💡 教师暑期推荐书单</h4><p>《给教师的建议》苏霍姆林斯基 · 《爱心与教育》李镇西 · 《班主任工作漫谈》魏书生 · 《学习之道》芭芭拉·奥克利 · 《被讨厌的勇气》岸见一郎</p></div>`;
  return html;
};
function bookAdd(){
  const name = document.getElementById('book_name').value.trim();
  if(!name){ toast('先写书名哦'); return; }
  const author = document.getElementById('book_author').value.trim();
  const books = getDB('read_books', []);
  books.push({name, author, s:0});
  setDB('read_books', books);
  toast('已加入书单 📖');
  renderContent();
}
function bookNext(i){
  const books = getDB('read_books', []);
  books[i].s = (books[i].s+1) % 3;
  setDB('read_books', books);
  if(books[i].s===2) toast('又读完一本 🎉');
  renderContent();
}
function bookDel(i){
  const books = getDB('read_books', []);
  books.splice(i,1);
  setDB('read_books', books);
  toast('已删除 🗑');
  renderContent();
}
