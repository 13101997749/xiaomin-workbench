<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晓敏的工作台 · 蓝色少女风</title>
<style>
/* ========== 全局变量与基础 ========== */
:root{
  --bg-blue:#dcefff;
  --bg-blue-soft:#eaf6ff;
  --card-bg:#ffffff;
  --title-red:#ff6b6b;
  --title-red-deep:#e85555;
  --accent-blue:#7ec5e8;
  --accent-blue-deep:#5bb0d8;
  --text-main:#4a5568;
  --text-soft:#8a9bb0;
  --shadow:0 6px 18px rgba(126,197,232,0.18);
  --shadow-soft:0 3px 10px rgba(126,197,232,0.12);
  --radius:16px;
  --radius-sm:10px;
  --sidebar-w:210px;
  --sidebar-w-collapsed:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--text-main);
  background-color:var(--bg-blue);
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.95) 1.5px, transparent 1.6px),
    radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1.2px);
  background-size:24px 24px, 16px 16px;
  background-position:0 0, 12px 12px;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,textarea,select{font-family:inherit;outline:none;}
ul{list-style:none;}

/* ========== 应用容器 ========== */
.app{
  display:flex;
  height:100vh;
  height:100dvh;
  width:100%;
  max-width:480px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 40px rgba(126,197,232,0.25);
}

/* ========== 侧边导航栏 ========== */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,#cfeaff 0%,#e3f1fd 100%);
  border-right:2px solid rgba(255,255,255,0.6);
  display:flex;
  flex-direction:column;
  transition:width .32s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
  z-index:30;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-header{
  padding:18px 12px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  border-bottom:1px dashed rgba(126,197,232,0.5);
}
.avatar{
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(135deg,#a8e0ff,#7ec5e8);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  border:3px solid #fff;
  box-shadow:0 4px 12px rgba(126,197,232,0.4);
  flex-shrink:0;
}
.nickname{
  margin-top:8px;
  font-size:13px;
  color:var(--title-red);
  font-weight:600;
  white-space:nowrap;
  text-align:center;
}
.sidebar.collapsed .nickname{display:none;}
.collapse-btn{
  position:absolute;
  top:14px;
  right:-14px;
  width:28px;height:28px;
  border-radius:50%;
  background:#fff;
  color:var(--accent-blue-deep);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  box-shadow:0 2px 8px rgba(126,197,232,0.4);
  z-index:31;
  transition:transform .32s;
}
.sidebar.collapsed .collapse-btn{transform:rotate(180deg);}
.nav-list{
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}
.nav-list::-webkit-scrollbar{width:0;}
.nav-item{
  display:flex;
  align-items:center;
  padding:12px 16px;
  margin:2px 8px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  color:var(--text-main);
  font-size:14px;
  transition:all .2s;
  white-space:nowrap;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.55);}
.nav-item.active{
  background:#fff;
  color:var(--title-red);
  font-weight:600;
  box-shadow:var(--shadow-soft);
}
.nav-item.active::before{
  content:"";
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:60%;
  background:var(--title-red);
  border-radius:0 4px 4px 0;
}
.nav-icon{font-size:18px;margin-right:10px;flex-shrink:0;}
.sidebar.collapsed .nav-icon{margin-right:0;}
.nav-text{transition:opacity .2s;}
.sidebar.collapsed .nav-text{display:none;}
.sidebar-footer{
  padding:10px;
  text-align:center;
  font-size:11px;
  color:var(--text-soft);
  border-top:1px dashed rgba(126,197,232,0.5);
}
.sidebar.collapsed .sidebar-footer{display:none;}

/* ========== 主面板 ========== */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}
.main-header{
  padding:14px 16px 8px;
  flex-shrink:0;
}
.page-title{
  font-size:20px;
  color:var(--title-red);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}
.page-subtitle{
  font-size:12px;
  color:var(--text-soft);
  margin-top:2px;
}

/* 标签栏 */
.tabs-wrap{
  padding:0 12px 8px;
  flex-shrink:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{
  display:flex;
  gap:8px;
}
.tab{
  flex-shrink:0;
  padding:7px 14px;
  border-radius:20px;
  background:rgba(255,255,255,0.7);
  font-size:13px;
  color:var(--text-main);
  white-space:nowrap;
  transition:all .2s;
  border:1.5px solid transparent;
}
.tab:hover{background:#fff;}
.tab.active{
  background:#fff;
  color:var(--title-red);
  border-color:var(--accent-blue);
  font-weight:600;
  box-shadow:var(--shadow-soft);
}

/* 内容区 */
.content{
  flex:1;
  overflow-y:auto;
  padding:4px 14px 90px;
  scrollbar-width:thin;
}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--accent-blue);border-radius:4px;}

/* 卡片 */
.card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow-soft);
}
.card-title{
  font-size:15px;
  font-weight:700;
  color:var(--title-red);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.card-title .edit-btn{
  margin-left:auto;
  font-size:12px;
  color:var(--accent-blue-deep);
  background:var(--bg-blue-soft);
  padding:3px 10px;
  border-radius:12px;
}

/* 输入与按钮 */
.input,.textarea,select.input{
  width:100%;
  padding:9px 12px;
  border:1.5px solid #d6eaf7;
  border-radius:var(--radius-sm);
  font-size:13px;
  background:#f8fcff;
  color:var(--text-main);
  transition:border-color .2s;
}
.input:focus,.textarea:focus{border-color:var(--accent-blue);}
.textarea{resize:vertical;min-height:60px;}
.btn{
  padding:8px 16px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  transition:all .2s;
}
.btn-primary{
  background:linear-gradient(135deg,#a8e0ff,#7ec5e8);
  color:#fff;
  box-shadow:0 3px 8px rgba(126,197,232,0.4);
}
.btn-primary:active{transform:scale(0.96);}
.btn-add{
  background:linear-gradient(135deg,#ffd1d1,#ff9b9b);
  color:#fff;
  box-shadow:0 3px 8px rgba(255,107,107,0.3);
}
.btn-add:active{transform:scale(0.96);}
.btn-mini{
  padding:4px 10px;
  font-size:11px;
  border-radius:10px;
  background:var(--bg-blue-soft);
  color:var(--accent-blue-deep);
}
.btn-del{
  color:var(--title-red);
  background:#fff0f0;
  padding:4px 8px;
  font-size:12px;
  border-radius:8px;
}

/* checkbox 自定义 */
.chk-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  background:#f8fcff;
  border-radius:var(--radius-sm);
  margin-bottom:6px;
  border:1px solid #e8f3fb;
  transition:all .2s;
}
.chk-wrap.done{
  background:#f0f9ff;
  opacity:.65;
}
.chk-wrap.done .chk-text{text-decoration:line-through;color:var(--text-soft);}
.chk{
  width:20px;height:20px;
  border:2px solid var(--accent-blue);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  cursor:pointer;
  background:#fff;
  transition:all .2s;
}
.chk.checked{background:var(--accent-blue);}
.chk.checked::after{content:"✓";color:#fff;font-size:13px;font-weight:bold;}
.chk-text{flex:1;font-size:13px;word-break:break-all;}
.chk-actions{display:flex;gap:6px;}

/* 标签行 */
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.row > *{flex:1;min-width:0;}
.row .btn{flex:0 0 auto;}

/* 标签徽章 */
.badge{
  display:inline-block;
  padding:2px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:600;
}
.badge-blue{background:#e3f1fd;color:var(--accent-blue-deep);}
.badge-red{background:#ffe8e8;color:var(--title-red);}
.badge-green{background:#e3fce8;color:#3aa855;}

/* ========== 运动打卡竖版 ========== */
.sport-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow-soft);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sport-item{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:12px;
  background:linear-gradient(135deg,#f6fbff,#eef7fd);
  border-radius:var(--radius-sm);
  border-left:3px solid var(--accent-blue);
}
.sport-item-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.sport-item-name{font-size:14px;font-weight:600;color:var(--text-main);}
.sport-item-meta{font-size:12px;color:var(--text-soft);}
.sport-stat{
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:12px;
}
.sport-stat-row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px dashed #e0eef9;
}
.sport-stat-row:last-child{border-bottom:none;}

/* ========== 经期日历 ========== */
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-head{
  text-align:center;
  font-size:11px;
  color:var(--text-soft);
  font-weight:600;
  padding:4px 0;
}
.cal-cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  border-radius:8px;
  cursor:pointer;
  background:#f8fcff;
  border:1px solid transparent;
  transition:all .15s;
  position:relative;
}
.cal-cell:hover{border-color:var(--accent-blue);}
.cal-cell.empty{background:transparent;cursor:default;}
.cal-cell.today{border-color:var(--accent-blue);font-weight:700;}
.cal-cell.period{
  background:linear-gradient(135deg,#ffb3b3,#ff8a8a);
  color:#fff;
  font-weight:600;
}
.cal-cell.predicted{
  background:#ffe0e0;
  color:var(--title-red);
}
.cal-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.cal-nav button{
  background:#fff;
  width:30px;height:30px;
  border-radius:50%;
  font-size:14px;
  color:var(--accent-blue-deep);
  box-shadow:var(--shadow-soft);
}
.cal-month{font-size:15px;font-weight:700;color:var(--title-red);}

/* ========== 记账图表 ========== */
.chart-bar-wrap{
  display:flex;
  align-items:flex-end;
  gap:6px;
  height:120px;
  padding:10px 4px 0;
}
.chart-bar{
  flex:1;
  background:linear-gradient(180deg,#a8e0ff,#7ec5e8);
  border-radius:6px 6px 0 0;
  min-height:4px;
  position:relative;
  transition:height .4s;
}
.chart-bar.expense{background:linear-gradient(180deg,#ffb3b3,#ff8a8a);}
.chart-bar-label{
  position:absolute;
  bottom:-20px;
  left:0;right:0;
  text-align:center;
  font-size:10px;
  color:var(--text-soft);
}
.chart-bar-val{
  position:absolute;
  top:-16px;
  left:0;right:0;
  text-align:center;
  font-size:9px;
  color:var(--text-soft);
}
.pie-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;}
.legend-dot{width:10px;height:10px;border-radius:3px;}

/* 消费分类条 */
.cat-bar-wrap{margin-bottom:10px;}
.cat-bar-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:4px;
}
.cat-bar-track{
  height:8px;
  background:#eef7fd;
  border-radius:4px;
  overflow:hidden;
}
.cat-bar-fill{
  height:100%;
  border-radius:4px;
  transition:width .5s;
}

/* ========== 小树洞情绪 ========== */
.mood-row{display:flex;gap:8px;flex-wrap:wrap;}
.mood-btn{
  padding:8px 14px;
  border-radius:20px;
  background:#f8fcff;
  font-size:13px;
  border:1.5px solid #e0eef9;
}
.mood-btn.selected{
  background:linear-gradient(135deg,#ffd1d1,#ff9b9b);
  color:#fff;
  border-color:transparent;
}

/* ========== 空状态 ========== */
.empty-state{
  text-align:center;
  padding:30px 16px;
  color:var(--text-soft);
  font-size:13px;
}
.empty-state .emoji{font-size:36px;display:block;margin-bottom:8px;}

/* ========== 浮动添加按钮 ========== */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:50px;height:50px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd1d1,#ff8a8a);
  color:#fff;
  font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(255,107,107,0.4);
  z-index:20;
  transition:transform .2s;
}
.fab:active{transform:scale(0.92);}

/* ========== Toast ========== */
.toast{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.8);
  background:rgba(0,0,0,0.7);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:all .25s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ========== 打卡卡片 ========== */
.checkin-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:linear-gradient(135deg,#f6fbff,#eef7fd);
  border-radius:var(--radius-sm);
  margin-bottom:8px;
}
.checkin-icon{font-size:24px;}
.checkin-info{flex:1;}
.checkin-title{font-size:14px;font-weight:600;}
.checkin-desc{font-size:11px;color:var(--text-soft);}
.checkin-status{
  font-size:12px;
  font-weight:600;
  padding:4px 10px;
  border-radius:10px;
}
.checkin-status.done{background:#e3fce8;color:#3aa855;}
.checkin-status.undone{background:#fff0f0;color:var(--title-red);}

/* 列表项 */
.list-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#f8fcff;
  border-radius:var(--radius-sm);
  margin-bottom:6px;
  border:1px solid #e8f3fb;
}
.list-item-text{flex:1;font-size:13px;word-break:break-all;}
.list-item-actions{display:flex;gap:6px;}

/* 统计行 */
.stat-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px dashed #e0eef9;
  font-size:13px;
}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text-soft);}
.stat-val{font-weight:600;color:var(--text-main);}
.stat-val.expense{color:var(--title-red);}
.stat-val.income{color:#3aa855;}

/* 食物清单 */
.food-list{display:flex;flex-wrap:wrap;gap:6px;}
.food-tag{
  padding:5px 12px;
  border-radius:14px;
  font-size:12px;
  font-weight:600;
}
.food-tag.good{background:#e3fce8;color:#3aa855;}
.food-tag.bad{background:#ffe8e8;color:var(--title-red);}

/* 弹出编辑 */
.modal-mask{
  position:fixed;inset:0;
  background:rgba(74,85,104,0.4);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal-mask.show{display:flex;}
.modal{
  background:#fff;
  border-radius:20px 20px 0 0;
  width:100%;max-width:480px;
  padding:18px;
  max-height:80vh;
  overflow-y:auto;
  animation:slideUp .3s;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-title{
  font-size:16px;font-weight:700;color:var(--title-red);
  margin-bottom:14px;display:flex;align-items:center;gap:6px;
}
.modal-title .close{margin-left:auto;font-size:18px;color:var(--text-soft);background:none;}

.hidden{display:none!important;}

.date-display{
  font-size:12px;
  color:var(--text-soft);
  text-align:center;
  margin-bottom:8px;
}
.date-display span{color:var(--title-red);font-weight:600;}

/* 新闻卡片 */
.news-card{
  background:#fff;
  border-radius:var(--radius-sm);
  padding:12px;
  margin-bottom:8px;
  border-left:3px solid var(--accent-blue);
  box-shadow:var(--shadow-soft);
}
.news-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.news-desc{font-size:12px;color:var(--text-soft);line-height:1.5;}
.news-source{font-size:10px;color:var(--accent-blue-deep);margin-top:4px;}

/* 进度环 */
.progress-ring-wrap{
  display:flex;
  align-items:center;
  gap:14px;
}
.progress-ring{
  width:70px;height:70px;
  position:relative;
}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring-bg{stroke:#eef7fd;}
.progress-ring-fg{stroke:var(--accent-blue);stroke-linecap:round;transition:stroke-dashoffset .5s;}
.progress-ring-text{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--title-red);
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 侧边导航栏 -->
  <aside class="sidebar" id="sidebar">
    <button class="collapse-btn" id="collapseBtn">‹</button>
    <div class="sidebar-header">
      <div class="avatar">🐰</div>
      <div class="nickname">晓敏的工作台</div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">💙 用心记录每一天</div>
  </aside>

  <!-- 主面板 -->
  <main class="main">
    <div class="main-header">
      <div class="page-title" id="pageTitle">🌸 每日计划</div>
      <div class="page-subtitle" id="pageSubtitle">今日饮食 · 待办 · 日程 · 作息</div>
    </div>
    <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
    <div class="content" id="content"></div>
  </main>

</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   数据层：localStorage 持久化
============================================================ */
const STORE_KEY = 'xiaomin_workbench_v1';
let DB = {};
function loadDB(){
  try{ DB = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ DB = {}; }
}
function saveDB(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
}
function getDB(key, def){
  if(!(key in DB)){ DB[key] = def; }
  return DB[key];
}
function setDB(key, val){
  DB[key] = val;
  saveDB();
}
loadDB();

/* ============================================================
   工具函数
============================================================ */
const today = ()=> new Date().toISOString().slice(0,10);
const todayCN = ()=>{ const d=new Date(); return `${d.getMonth()+1}月${d.getDate()}日`; };
const nowMonth = ()=> new Date().toISOString().slice(0,7);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ============================================================
   渲染：侧边栏
============================================================ */
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = MENUS.map(m=>`
    <li class="nav-item ${m.id===currentMenu?'active':''}" data-menu="${m.id}">
      <span class="nav-icon">${m.icon}</span>
      <span class="nav-text">${m.name}</span>
    </li>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{
      currentMenu = el.dataset.menu;
      currentTab = MENUS.find(m=>m.id===currentMenu).tabs[0].id;
      renderAll();
    };
  });
}

/* ============================================================
   渲染：标签栏
============================================================ */
function renderTabs(){
  const menu = MENUS.find(m=>m.id===currentMenu);
  document.getElementById('pageTitle').innerHTML = `${menu.icon} ${menu.name}`;
  document.getElementById('pageSubtitle').textContent = menu.sub;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = menu.tabs.map(t=>`
    <div class="tab ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.name}</div>
  `).join('');
  tabs.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{
      currentTab = el.dataset.tab;
      renderTabs();
      renderContent();
    };
  });
}

/* ============================================================
   渲染：内容区（路由）
============================================================ */
function renderContent(){
  const c = document.getElementById('content');
  c.scrollTop = 0;
  const fn = RENDERS[currentTab];
  c.innerHTML = fn ? fn() : '<div class="empty-state"><span class="emoji">🚧</span>建设中...</div>';
  bindContent();
}

function renderAll(){
  renderNav();
  renderTabs();
  renderContent();
}

RENDERS.monthly = function(){

  html += `<div class="card">

    html += `<div class="cat-bar-wrap">

    <div class="chart-bar-wrap">`;

  for(let d=1; d<=daysInMonth; d++){

let calDate = new Date();
RENDERS.calendar = function(){
  const periodDays = getDB('period_days', {}); // {dateStr: true}
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  // 预测：根据最近3次经期平均周期预测下次
  const sortedPeriods = Object.keys(periodDays).filter(d=>d.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)||true).sort();
  // 简单预测：如果本月有打卡，标注；若上月有，预测本月相应日期
  const lastMonthKey = `${year}-${String(month).padStart(2,'0')}`;
  const lastMonthDays = Object.keys(periodDays).filter(d=>d.startsWith(lastMonthKey)).sort();
  const thisMonthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const thisMonthDays = Object.keys(periodDays).filter(d=>d.startsWith(thisMonthKey)).sort();
  let predictedSet = new Set();
  if(lastMonthDays.length>0 && thisMonthDays.length===0){
    const cycle = 28;
    lastMonthDays.forEach(d=>{
      const dd = new Date(d);
      dd.setDate(dd.getDate()+cycle);
      if(dd.getFullYear()===year && dd.getMonth()===month){
        predictedSet.add(dd.getDate());
      }
    });
  }
  let html = `<div class="card">
    <div class="card-title">🌸 周期日历</div>
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <span class="cal-month">${year}年${month+1}月</span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">
      ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-head">${w}</div>`).join('')}
      ${Array(firstDay).fill('<div class="cal-cell empty"></div>').join('')}
      ${Array.from({length:daysInMonth},(_,i)=>{
        const d = i+1;
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dateStr===today();
        const isPeriod = periodDays[dateStr];
        const isPredicted = predictedSet.has(d);
        const cls = `cal-cell ${isToday?'today':''} ${isPeriod?'period':''} ${isPredicted&&!isPeriod?'predicted':''}`;
        return `<div class="${cls}" onclick="togglePeriod('${dateStr}')">${d}</div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:12px;margin-top:12px;font-size:11px;color:var(--text-soft);">
      <span>🟥 来潮打卡</span>
      <span>🟪 预测日期</span>
      <span>🔵 今天</span>
    </div>
  </div>`;
  // 来潮打卡
  const todayPeriod = periodDays[today()];
  html += `<div class="card">
    <div class="card-title">💧 来潮打卡</div>
    <div class="checkin-card">
      <div class="checkin-icon">🌸</div>
      <div class="checkin-info"><div class="checkin-title">今日来潮</div><div class="checkin-desc">${todayCN()}</div></div>
      <div class="checkin-status ${todayPeriod?'done':'undone'}" onclick="togglePeriod('${today()}')">${todayPeriod?'已记录 ✓':'打卡'}</div>
    </div>
  </div>`;
  return html;
};

// 记账
function addAccountRecord(){
  const now = new Date().toTimeString().slice(0,5);
  openModal(`
    <div class="modal-title">➕ 记一笔<button class="close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <button class="btn" id="typeExpense" style="flex:1;background:linear-gradient(135deg,#ffb3b3,#ff8a8a);color:#fff;" onclick="switchAcctType('expense')">💸 支出</button>
      <button class="btn" id="typeIncome" style="flex:1;background:#f0f0f0;" onclick="switchAcctType('income')">💰 收入</button>
    </div>
    <input type="hidden" id="acctType" value="expense">
    <input class="input" id="acctAmount" placeholder="金额" type="number" step="0.01">
    <select class="input" id="acctCat" style="margin-top:8px;"></select>
    <input class="input" id="acctNote" placeholder="备注（可选）" style="margin-top:8px;">
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveAccountAdd('${now}')">➕ 添加</button>
      <button class="btn" style="background:#f0f0f0;" onclick="closeModal()">取消</button>
    </div>
  `);
  switchAcctType('expense');
}
function switchAcctType(type){
  document.getElementById('acctType').value = type;
  const cats = type==='expense' ? EXPENSE_CATS : INCOME_CATS;
  document.getElementById('acctCat').innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  document.getElementById('typeExpense').style.cssText = type==='expense' ? 'flex:1;background:linear-gradient(135deg,#ffb3b3,#ff8a8a);color:#fff;' : 'flex:1;background:#f0f0f0;';
  document.getElementById('typeIncome').style.cssText = type==='income' ? 'flex:1;background:linear-gradient(135deg,#a8e0a8,#7ec57e);color:#fff;' : 'flex:1;background:#f0f0f0;';
}
function saveAccountAdd(time){
  const amount = parseFloat(document.getElementById('acctAmount').value);
  if(!amount || amount<=0){ toast('请输入有效金额'); return; }
  const key = `account_${today()}`;
  const list = getDB(key, []);
  list.push({
    type: document.getElementById('acctType').value,
    amount: amount,
    cat: document.getElementById('acctCat').value,
    note: document.getElementById('acctNote').value.trim(),
    time: time,
    date: today()
  });
  setDB(key, list);
  closeModal();
  toast('已记录 💰');
  renderContent();
}
function delAccountRecord(i){
  const key = `account_${today()}`;
  const list = getDB(key, []);
  list.splice(i,1);
  setDB(key, list);
  toast('已删除 🗑');
  renderContent();
}

}
